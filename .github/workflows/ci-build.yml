name: CI Build Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  install-scripts:
    name: Test Installer Scripts (systemd and Alpine OpenRC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run installer regression tests
        run: bash test-install-scripts-proxy.sh

      - name: Test Alpine bootstrap and OpenRC lifecycle
        run: docker run --rm -v "$PWD:/workspace:ro" alpine:3.22 sh /workspace/test-install-scripts-alpine.sh

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.28.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Test flow aggregation
        run: node scripts/test-flow-data.mjs

      - name: Build
        run: pnpm run build

      # The online demo answers the API from a recording: fail when a page
      # breaks or asks for something that was never recorded.
      - name: Check online demo
        run: |
          VITE_DEMO=true VITE_BASE=/hoplane/demo/ pnpm exec vite build --outDir dist-demo
          node scripts/demo/check.mjs dist-demo

  backend:
    name: Build and Test Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: go-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above"; exit 1; }

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  backend-postgres-contract:
    name: Go Backend PostgreSQL Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hoplane_test
          POSTGRES_PASSWORD: hoplane_test_pass
          POSTGRES_DB: hoplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoplane_test -d hoplane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: go-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run PostgreSQL contract test
        env:
          HOPLANE_POSTGRES_TEST_DSN: 'postgres://hoplane_test:hoplane_test_pass@127.0.0.1:5432/hoplane_test?sslmode=disable'
        run: go test ./tests/contract -run TestPostgresNodeCreateRepairsMissingIDDefaultContract -count=1

  agent:
    name: Build Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-gost
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: go-gost/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v .

      - name: Vet
        run: go vet ./...

  image-names:
    name: Check Compose Image Names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A rename that lands in only one place ships a compose file pointing at
      # an image the release never builds; installing then fails on pull.
      - name: Compose images must be the ones the release builds
        run: |
          set -eu
          built=$(grep -ohE '^[[:space:]]*-t .*/\$\{OWNER\}/[a-z0-9-]+:' .github/workflows/docker-build.yml \
            | sed -E 's#.*\$\{OWNER\}/([a-z0-9-]+):#\1#' | sort -u)
          used=$(grep -ohE 'ghcr\.io/[a-z0-9-]+/[a-z0-9-]+:' docker-compose-v4.yml docker-compose-v6.yml \
            | sed -E 's#.*/##; s#:##' | sort -u)
          echo "release builds: $(echo "$built" | tr '\n' ' ')"
          echo "compose uses:   $(echo "$used" | tr '\n' ' ')"
          missing=$(comm -13 <(printf '%s\n' "$built") <(printf '%s\n' "$used"))
          if [ -n "$missing" ]; then
            echo "::error::compose references images the release does not build: $(echo "$missing" | tr '\n' ' ')"
            exit 1
          fi
