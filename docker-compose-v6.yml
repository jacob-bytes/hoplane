services:
  backend:
    image: ghcr.io/jacob-bytes/hoplane-panel-backend:${HOPLANE_VERSION:-latest}
    container_name: hoplane-panel-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_PATH: /app/data/gost.db
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      HOPLANE_WEBAUTHN_ORIGIN: ${HOPLANE_WEBAUTHN_ORIGIN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SERVER_ADDR: :6365
      TZ: Asia/Shanghai
      HOPLANE_VERSION: ${HOPLANE_VERSION:-dev}
      PANEL_DEPLOY_DIR: /opt/hoplane-panel
      PANEL_BACKEND_CONTAINER: hoplane-panel-backend
    ports:
      - "${BACKEND_PORT}:6365"
    volumes:
      - sqlite_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/opt/hoplane-panel
    networks:
      - hoplane-network
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:6365/flow/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: hoplane-panel-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoplane_panel}
      POSTGRES_USER: ${POSTGRES_USER:-hoplane_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoplane_panel_change_me}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hoplane-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoplane_panel} -d ${POSTGRES_DB:-hoplane_panel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ghcr.io/jacob-bytes/vite-frontend:${HOPLANE_VERSION:-latest}
    container_name: hoplane-frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hoplane-network


volumes:
  sqlite_data:
    name: sqlite_data
    driver: local
  postgres_data:
    name: postgres_data
    driver: local


networks:
  hoplane-network:
    name: hoplane-network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.80.0.0/16 
        - subnet: fd00:dead:beef::/48
